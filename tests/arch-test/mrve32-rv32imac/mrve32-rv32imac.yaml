# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json

# UDB architecture configuration for MRVE32 (the `mrve32` CLI, default
# options). Must agree with sail.json. Based on riscv-arch-test's
# config/cores/hazard3/hazard3-rv32imacb-u-pmp (same class of core) without
# U-mode, B/Zcb and PMP, and with an mtval that reports addresses/encodings.
# SPDX-License-Identifier: Apache-2.0
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: mrve32-rv32imac
description: MRVE32 emulator - RV32IMAC_Zicsr_Zifencei_Zicntr, M-mode only, no PMP

implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0" }
  # cycle/instret and their h halves; there is no time CSR (see below).
  - { name: Zicntr, version: "= 2.0" }
  # Every FENCE encoding executes as a fence, so pause is a fence that orders
  # nothing; ntl.* and c.ntl.* are adds to x0.
  - { name: Zihintntl, version: "= 1.0.0" }
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: Sm, version: "= 1.12.0" }

params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32

  # misa is read-only (the CLI's --isa selects C before the run).
  MISA_CSR_IMPLEMENTED: true
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  MUTABLE_MISA_A: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_M: false

  M_MODE_ENDIANNESS: little

  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # mtval: faulting address, ebreak pc, or the illegal instruction's encoding.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  # CLINT (msip, mtimecmp) and the UART interrupt drive mip directly.
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true

  WFI_U_MODE: false
  WFI_FINITE: false

  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  # One reservation for exactly the word loaded by lr.w; sc.w to any other
  # address fails. Stores do not clear it.
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_NON_EXACT_LRSC: true
  LRSC_FAIL_ON_VA_SYNONYM: false

  # mvendorid, marchid, mimpid and mconfigptr read as zero.
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  CONFIG_PTR_ADDRESS: 0

  # MODE bit 1 is hardwired to 0, so MODE = 2 or 3 selects Direct or Vectored.
  MTVEC_MODES: [0, 1]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4

  PMA_GRANULARITY: 2

  NUM_PMP_ENTRIES: 0
  NUM_USABLE_PMP_ENTRIES: 0
  PMP_GRANULARITY: 2
  PMP_NA4_SUPPORTED: false
  PMP_NAPOT_SUPPORTED: false
  PMP_TOR_SUPPORTED: false

  # mhpmcounter3..31 and mhpmevent3..31 are read-only zero.
  HPM_COUNTER_EN:
    [false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]

  # Only mcountinhibit.CY and IR are writable.
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
    [true, false, true, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]

  # No U-mode, so no mcounteren.
  MCOUNTENABLE_EN:
    [false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]

  # There is no time CSR. ACT emulates reads of time from the CLINT's mtime.
  TIME_CSR_IMPLEMENTED: false
