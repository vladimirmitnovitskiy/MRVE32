[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mrve32-snn"
description = "SNN layer accelerator device module for the MRVE32 RISC-V emulator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["risc-v", "snn", "spiking-neural-network", "neuromorphic", "emulator"]
dynamic = ["version"]
# The device is passed to mrve32 through the device C ABI (version 2).
dependencies = ["mrve32>=0.1,<0.2", "numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Emulators",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Documentation = "https://github.com/vladimirmitnovitskiy/MRVE32/blob/main/docs/python.md#mrve32-snn"
Repository = "https://github.com/vladimirmitnovitskiy/MRVE32"
Issues = "https://github.com/vladimirmitnovitskiy/MRVE32/issues"
Changelog = "https://github.com/vladimirmitnovitskiy/MRVE32/blob/main/CHANGELOG.md"

[tool.maturin]
exclude = ["**/__pycache__/**", "**/*.pyc"]
features = ["python"]
python-source = "python"
module-name = "mrve32_snn._snn"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
