[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mrve32-snn"
description = "SNN layer accelerator device module for the MRVE32 RISC-V emulator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
# The device is passed to mrve32 through the device C ABI (version 1).
dependencies = ["mrve32>=0.1,<0.2", "numpy>=1.24"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Emulators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "mrve32_snn._native"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
